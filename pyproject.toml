[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embeddingvc"
version = "0.1.0"
description = "Git-inspired version control for embedding collections"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "PyMuPDF==1.28.2"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=5.1,<6"]
vector-store = ["chromadb>=1.0,<2"]
tui = ["rich>=13,<16", "prompt_toolkit>=3.0.40,<4"]
# Everything needed for embed, commit, checkout, benchmark and the interactive shell.
all = ["embeddingvc[embeddings,vector-store,tui]"]

[project.scripts]
embeddingvc = "embeddingvc.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
embeddingvc = ["templates/*.md", "templates/*.yaml"]
