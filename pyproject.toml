[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embeddingvc"
version = "0.1.0"
description = "Git-inspired version control for embedding collections"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Reads embeddingvc.yaml.
    "PyYAML>=6.0,<7",
    # Extracts PDF text. Pinned to one major line: an extraction change
    # alters staged chunks, so the installed version is recorded in the
    # staging snapshot and a bump re-chunks every tracked PDF.
    "PyMuPDF>=1.24,<2",
]

[project.scripts]
embeddingvc = "embeddingvc.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
embeddingvc = ["templates/*.md", "templates/*.yaml"]
