[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embeddingvc"
version = "0.1.0"
description = "Git-inspired version control for embedding collections"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
embeddingvc = "embeddingvc.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
embeddingvc = ["templates/*.md", "templates/*.yaml"]
